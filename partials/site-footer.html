<footer class="site-footer" id="contact">
  <div class="site-footer__inner">
    <p class="site-footer__eyebrow reveal">Контакты</p>
    <h2 class="site-footer__title reveal">Есть задача?</h2>
    <a class="site-footer__cta reveal" href="mailto:{{email}}">
      Давайте обсудим
      <svg class="icon-arrow-ne" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-arrow-ne"/></svg>
    </a>

    <div class="site-footer__cols reveal">
      <nav class="site-footer__nav" aria-label="Навигация в подвале">
        <p class="site-footer__col-title" aria-hidden="true"></p>
        <a href="{{worksHref}}">Портфолио</a>
        <a href="{{aboutHref}}">Обо мне</a>
        <a href="{{contactPageHref}}">Контакты</a>
      </nav>

      <nav class="site-footer__nav" aria-label="Направления">
        <p class="site-footer__col-title">Направления</p>
        <a href="{{brandHref}}">Бренд &amp; коммуникация</a>
        <a href="{{productHref}}">Продукт &amp; UX/UI</a>
        <a href="{{webHref}}">Web &amp; digital</a>
      </nav>

      <div class="site-footer__col">
      <p class="site-footer__col-title" aria-hidden="true"></p>
      <ul class="social-list">
        {{> social-links}}
        <li>
          <a class="link-arrow" href="mailto:{{email}}">
            <span>Email</span>
            <svg class="icon-arrow-ne" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-arrow-ne"/></svg>
          </a>
        </li>
      </ul>
      </div>
    </div>

    <p class="site-footer__copy reveal"><span class="js-year">{{year}}</span>&nbsp;LS&nbsp;DESIGN</p>
  </div>
</footer>
